<!doctype html>
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' https://i.ytimg.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>DarkWolfPlayZ — Full videos</title>
<meta name="description" content="Watched a DarkWolfPlayZ Short? Paste its link here to jump to the original video at the exact moment.">
<meta property="og:title" content="DarkWolfPlayZ — Full videos">
<meta property="og:description" content="Paste a Short's link, land on the original at the exact moment.">
<meta property="og:image" content="assets/mascot/hello.png">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="assets/mascot/hello.png">
<link rel="stylesheet" href="assets/site.css?v=19fd0a5add">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" id="channelLink" href="https://www.youtube.com/channel/UC2cCOweXSSb-o-y6JBDT1Xw" rel="noopener">DarkWolfPlayZ</a>
    <span class="tag">Full videos</span>
  </header>

  <section class="hero">
    <img id="mascot" class="mascot" src="assets/mascot/hello.png" alt="" width="214" height="234">
    <div class="bubble" id="bubble" aria-live="polite">Hey! Want the full video?</div>
  </section>

  <section class="card finder">
    <h1>Paste the Short's link</h1>
    <p class="hint">On the Short tap <b>Share → Copy link</b>, then paste it here.</p>
    <form id="finder" autocomplete="off">
      <input id="link" type="url" inputmode="url" placeholder="youtube.com/shorts/…" aria-label="Short link" spellcheck="false" autocapitalize="off">
      <div class="row">
        <button type="button" id="pasteBtn" class="btn ghost">📋 Paste</button>
        <button type="submit" class="btn main">Take me there ▶</button>
      </div>
    </form>
    <div id="result" class="result" hidden></div>
  </section>

  <section class="latest">
    <div class="latest-head">
      <h2>Latest clips</h2>
      <div id="filters" class="filters" role="tablist"></div>
    </div>
    <div id="list" class="grid"><p class="empty">Loading clips…</p></div>
  </section>

  <footer class="foot">
    Clips credit the original creators — every one links back to their full video.<br>
    <a href="https://www.youtube.com/channel/UC2cCOweXSSb-o-y6JBDT1Xw?sub_confirmation=1" rel="noopener">Subscribe to DarkWolfPlayZ</a>
  </footer>
</main>
<script src="assets/site.js?v=19fd0a5add"></script>
</body>
</html>
